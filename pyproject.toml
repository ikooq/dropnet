[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropnet"
version = "0.1.0"
description = "Scattered fraud complaints -> one connected case, on an embedded Relate graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "relate-db==1.0.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.3,<3",
]

[project.scripts]
dropnet = "dropnet.__main__:main"

[project.optional-dependencies]
agent = ["pydantic-ai"]
ml = ["sentence-transformers"]
dev = ["pytest>=8", "httpx>=0.27", "neo4j>=5"]

[tool.setuptools.packages.find]
include = ["dropnet*"]

[tool.setuptools.package-data]
dropnet = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
