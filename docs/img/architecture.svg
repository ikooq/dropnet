<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="960" height="450" fill="#11151b"/>
  <style>
    .box{fill:#181e26;stroke:#2a323d;stroke-width:1.2}
    .hi{fill:#2b1d16;stroke:#d9480f;stroke-width:1.6}
    .t{fill:#e6e9ee;font-weight:600}
    .s{fill:#98a2b1;font-size:11.5px}
    .a{stroke:#98a2b1;stroke-width:1.4;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b1"/></marker></defs>

  <text x="24" y="34" class="t" font-size="16">Dropnet: data flow</text>

  <rect class="box" x="24" y="60" width="210" height="62" rx="8"/>
  <text x="38" y="84" class="t">FTC Do Not Call reports</text>
  <text x="38" y="103" class="s">296,273 reports · Oct 9 – Nov 12</text>

  <rect class="box" x="24" y="136" width="210" height="62" rx="8"/>
  <text x="38" y="160" class="t">NANPA numbering records</text>
  <text x="38" y="179" class="s">holders · 1,000-blocks · rate centers</text>

  <rect class="box" x="24" y="212" width="210" height="62" rx="8"/>
  <text x="38" y="236" class="t">FCC consumer complaints</text>
  <text x="38" y="255" class="s">independent cross-check</text>

  <rect class="hi" x="290" y="60" width="310" height="186" rx="10"/>
  <text x="306" y="86" class="t">Relate: data/ftc.rl (one 89 MB file)</text>
  <text x="306" y="108" class="s">Report → Number → Block (NPA-NXX) → AreaCode</text>
  <text x="306" y="125" class="s">Report → Subject · State · consumer area code</text>
  <text x="306" y="142" class="s">Block → HELD_BY → Carrier → CarrierGroup</text>
  <text x="306" y="159" class="s">Number → SubBlock → ASSIGNED_TO → Carrier</text>
  <text x="306" y="176" class="s">Block → RateCenter · FtcCampaign (flagged ranges)</text>
  <text x="306" y="198" class="s">Cypher: ranges, holders ranked, shared-holder links</text>
  <text x="306" y="215" class="s">what-if in a rolled-back transaction</text>
  <text x="306" y="232" class="s">relate clone → Parquet bundle</text>

  <line class="a" x1="234" y1="91" x2="288" y2="110"/>
  <line class="a" x1="234" y1="167" x2="288" y2="160"/>
  <line class="a" x1="234" y1="243" x2="288" y2="215"/>

  <rect class="box" x="650" y="40" width="286" height="46" rx="8"/>
  <text x="664" y="60" class="t">Web app (FastAPI + cytoscape)</text>
  <text x="664" y="77" class="s">number check, holders, case graph, what-if</text>
  <rect class="box" x="650" y="96" width="286" height="46" rx="8"/>
  <text x="664" y="116" class="t">Browser demo: Relate WASM</text>
  <text x="664" y="133" class="s">GitHub Pages, no install, smaller graph</text>
  <rect class="box" x="650" y="152" width="286" height="46" rx="8"/>
  <text x="664" y="172" class="t">Agents: MCP + Claude Code hook</text>
  <text x="664" y="189" class="s">evidence, holder and caution per number</text>
  <rect class="box" x="650" y="208" width="286" height="46" rx="8"/>
  <text x="664" y="228" class="t">Bolt · HTTP Query API · relate serve --mcp</text>
  <text x="664" y="245" class="s">the same file for Neo4j drivers and tools</text>
  <rect class="box" x="650" y="264" width="286" height="46" rx="8"/>
  <text x="664" y="284" class="t">One-file cases</text>
  <text x="664" y="301" class="s">download one flagged range as its own .rl</text>

  <line class="a" x1="600" y1="100" x2="648" y2="63"/>
  <line class="a" x1="600" y1="120" x2="648" y2="119"/>
  <line class="a" x1="600" y1="145" x2="648" y2="175"/>
  <line class="a" x1="600" y1="175" x2="648" y2="231"/>
  <line class="a" x1="600" y1="205" x2="648" y2="287"/>

  <rect class="box" x="290" y="274" width="310" height="156" rx="10"/>
  <text x="306" y="300" class="t">Evidence, measured (complaint matches)</text>
  <text x="306" y="322" class="s">hold-out: 4.3 % numbers → 14.3 % with ranges</text>
  <text x="306" y="340" class="s">same budget, naive range ranking: 14.5 % (a tie)</text>
  <text x="306" y="358" class="s">holders: 4 of top 15 at ≥20 flagged per 100</text>
  <text x="306" y="376" class="s">leading holders' ranges flagged later: 3.7×</text>
  <text x="306" y="394" class="s">FCC: 49 of 50 top ranges (vs 9.2 % random)</text>
  <text x="306" y="412" class="s">price shown: 10,000 numbers per range rule</text>
  <line class="a" x1="445" y1="248" x2="445" y2="272"/>
</svg>
