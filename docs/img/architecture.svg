<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#11151b"/>
  <style>
    .box{fill:#181e26;stroke:#2a323d;stroke-width:1.2}
    .hi{fill:#2b1d16;stroke:#d9480f;stroke-width:1.6}
    .t{fill:#e6e9ee;font-weight:600}
    .s{fill:#98a2b1;font-size:11.5px}
    .a{stroke:#98a2b1;stroke-width:1.4;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98a2b1"/></marker></defs>

  <text x="24" y="34" class="t" font-size="16">Dropnet — data flow</text>

  <rect class="box" x="24" y="60" width="200" height="70" rx="8"/>
  <text x="38" y="86" class="t">FTC Do Not Call reports</text>
  <text x="38" y="106" class="s">296,273 real reports · daily CSV</text>
  <text x="38" y="121" class="s">US public data</text>

  <rect class="box" x="24" y="150" width="200" height="60" rx="8"/>
  <text x="38" y="176" class="t">FCC consumer complaints</text>
  <text x="38" y="196" class="s">13,696 · independent cross-check</text>

  <rect class="hi" x="290" y="60" width="300" height="150" rx="10"/>
  <text x="306" y="86" class="t">Relate — data/ftc.rl (one 40 MB file)</text>
  <text x="306" y="108" class="s">Report → Number → Block (NPA-NXX) → AreaCode</text>
  <text x="306" y="126" class="s">Report → Subject · State · VictimArea (spoofing)</text>
  <text x="306" y="144" class="s">FtcCampaign (pools) · SIBLING · PoolNetwork</text>
  <text x="306" y="166" class="s">Cypher aggregations · range indexes</text>
  <text x="306" y="184" class="s">what-if in a rolled-back transaction</text>
  <text x="306" y="200" class="s">relate clone → Parquet bundle</text>

  <line class="a" x1="224" y1="95" x2="288" y2="110"/>
  <line class="a" x1="224" y1="180" x2="288" y2="165"/>

  <rect class="box" x="650" y="40" width="286" height="46" rx="8"/>
  <text x="664" y="60" class="t">Web app (FastAPI + cytoscape)</text>
  <text x="664" y="77" class="s">pools, networks, number check, what-if</text>
  <rect class="box" x="650" y="96" width="286" height="46" rx="8"/>
  <text x="664" y="116" class="t">Browser demo — Relate WASM</text>
  <text x="664" y="133" class="s">GitHub Pages, no install, ~1 s load</text>
  <rect class="box" x="650" y="152" width="286" height="46" rx="8"/>
  <text x="664" y="172" class="t">Agents — MCP + Claude Code hook</text>
  <text x="664" y="189" class="s">evidence + spoofing caution per number</text>
  <rect class="box" x="650" y="208" width="286" height="46" rx="8"/>
  <text x="664" y="228" class="t">Neo4j drivers over Bolt · push to Aura</text>
  <text x="664" y="245" class="s">relate serve --bolt · relate push --dry-run</text>
  <rect class="box" x="650" y="264" width="286" height="46" rx="8"/>
  <text x="664" y="284" class="t">Case vault (markdown) · one-file cases</text>
  <text x="664" y="301" class="s">Relate opens it as a graph, Obsidian as notes</text>

  <line class="a" x1="590" y1="100" x2="648" y2="63"/>
  <line class="a" x1="590" y1="115" x2="648" y2="119"/>
  <line class="a" x1="590" y1="135" x2="648" y2="175"/>
  <line class="a" x1="590" y1="160" x2="648" y2="231"/>
  <line class="a" x1="590" y1="190" x2="648" y2="287"/>

  <rect class="box" x="290" y="250" width="300" height="150" rx="10"/>
  <text x="306" y="276" class="t">Evidence, measured</text>
  <text x="306" y="298" class="s">hold-out: 14.3 % vs 4.3 % blocklist (geographic)</text>
  <text x="306" y="316" class="s">vs random blocks: 4.7× lift</text>
  <text x="306" y="334" class="s">FCC: 49 of 50 top pools confirmed (vs 9.2 %)</text>
  <text x="306" y="352" class="s">agent without graph: 39.5 % wrongly blamed</text>
  <text x="306" y="370" class="s">network: 15 ranges, 11,071 reports</text>
  <text x="306" y="388" class="s">price shown: 10,000 numbers per block rule</text>
  <line class="a" x1="440" y1="212" x2="440" y2="248"/>
</svg>
